name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: '0.31.1'

      - name: Compile Compact contract
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build
